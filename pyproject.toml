[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cavity-modes"
version = "0.1.0"
description = "Axisymmetric RF cavity eigenmodes and beam dynamics through them"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["cavity_modes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
