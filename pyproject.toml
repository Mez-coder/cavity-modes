[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cavity-modes"
version = "0.3.0"
description = "Axisymmetric RF cavity eigenmodes and beam dynamics through them"
requires-python = ">=3.10"
dependencies = [
    "gmsh>=4.15.2",
    "numpy>=1.24",
    "scikit-fem>=12.0.2",
    "scipy>=1.10",
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.scripts]
cavity-ui = "cavity_modes.server:main"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

# PEP 735 dependency groups: `uv sync` installs "dev" by default
[dependency-groups]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["cavity_modes"]

[tool.setuptools.package-data]
cavity_modes = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
